<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>protoBar2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- DIFFERENT: heading text only. -->
    <h1>Current bar: bouncing arrow</h1>

    <div class="timeline-wrap">
      <div class="label">Current bar</div>
      <div class="timeline" id="timeline">
        <div class="playhead"></div>
        <!-- the svg of the arrow is placed in the timeline div so its positioned correctly inside the slots -->
        <svg class="arrow" id="arrow" viewBox="0 0 20 16" aria-hidden="true">
          <path d="M0 0 H20 L10 16 Z"></path>
        </svg>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
