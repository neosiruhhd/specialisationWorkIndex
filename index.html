<!DOCTYPE html>
<html land="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>protoHealth1</title>
        <link rel="stylesheet" href="style.css"> 
    </head>

    <body>
        <main>
            <h1>Health: vertical bar</h1>

            <!-- for the visual bar itself, html places it, css colours it, and js calculates the percentage and changes the vertical scale of it accordingly. using a div to be able to target it across files. "bar" class is the grey rectangle behind, "fill" class is the red health box in front -->
            <div class="bar">
                <!-- class is for css targeting, id is for js targeting -->
                <div class="fill" id="fill"></div>
            </div>
            
            <!-- the 'label for' line lets the browser know that the label of 'Current HP' and the number field next to it are associated, not just placed together by coincidence. -->
            <label for="hp">Current HP</label>
            <div class="hp-row">
                <!-- parameters set through the input element, letting me set the minimum and max health for the prototype, what it starts at, and in what increments or 'steps' the user can change it with through button taps -->
                <input id="hp" type="number" min="0" max="500" step="10" value="500">
                <span>/ 500</span>
            </div>
        </main>

        <!-- script is at the end since js will need to target elements from html, and it cant do that before all the elemtetns have loaded sequiuentially -->
         <script src="script.js"></script>
    </body>
</html>
