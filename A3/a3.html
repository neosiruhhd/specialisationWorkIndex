<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sirens.io</title>

        <!-- linking all the appropriate fonts through Google Fonts. i used MedievalSharp for headings and (N)PC names, and Xanh Mono for everything else. -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Xanh+Mono&display=swap">

        <link rel="stylesheet" href="style3.css">
    </head>

    <body>
    <!-- The party and boss areas start empty: script3.js fills them with a column per character in the next stage. -->
  <section class="screen setup" id="setup" aria-label="Setup">

    <div class="top">
      <h1 class="brand">Sirens.io</h1>
      <div class="btnrow">
        <!-- button to progress to combat screen disabled until every character has a name and valid HP (stage 4). -->
        <button class="btn green" id="to-combat" type="button" disabled>Combat Screen</button>
        <button class="btn red" id="reset" type="button">Reset</button>
      </div>
    </div>

    <!-- the combat screen puts the volume slider here once the user is on the combat screen -->
    <div class="rail-top"></div>

    <div class="stage" id="setup-party"></div>

    <div class="rail" id="setup-boss"></div>

    <div class="bottom">
      <p class="instructions">Make edits to HP and names.<br>Then proceed to the Combat Screen.</p>
    </div>

  </section>

  <!-- COMBAT SCREEN -->
  <!-- same five-area grid as setup, all hidden until the dm presses combat screen -->
  <section class="screen combat" id="combat" aria-label="Combat" hidden>

    <div class="top">
      <h2 class="heading">Override Controls</h2>
      <div class="btnrow">
        <!-- all four start disabled, the audio engine switches them on in later commits -->
        <button class="btn green" id="begin" type="button" disabled>Begin Combat</button>
        <button class="btn grey" id="play" type="button" disabled>Play</button>
        <button class="btn grey" id="pause" type="button" disabled>Pause</button>
        <button class="btn red" id="end" type="button" disabled>End Combat</button>
        <!-- the 'end-confirm' shown after the first press of end combat, asking the dm to press again to confirm -->
        <span class="confirm-box" id="end-confirm" hidden>End combat? The outro will play.</span>
      </div>
      <!-- short status messages like loading progress, filled in by the script -->
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <!-- volume: the label and percentage on one line, the slider underneath -->
    <div class="rail-top">
      <div class="vol-head">
        <label class="heading" for="volume">Volume</label>
        <span class="vol-pct" id="vol-pct">50%</span>
      </div>
      <input class="vol" id="volume" type="range" min="0" max="100" step="1" value="50">
    </div>

    <div class="stage" id="combat-party"></div>

    <div class="rail" id="combat-boss"></div>

    <div class="bottom">
      <!-- bar timeline: 5 past bars, the current bar under the playhead, then 4 upcoming bars -->
      <!-- the empty rings and moving dots are added by the script -->
      <div class="timeline-wrap">
        <div class="tl-tab">Current Bar</div>
        <div class="timeline" id="timeline">
          <div class="playhead"></div>
        </div>
      </div>

      <!-- only shown while an hp change is waiting to be confirmed -->
      <div class="hp-actions" id="hp-actions" hidden>
        <button class="btn brown" id="undo" type="button">Undo</button>
        <button class="btn green" id="confirm" type="button">Confirm</button>
      </div>
    </div>

  </section>
  
  <!-- BATTLE ENDED -->
  <!-- covers the combat screen once the outro has finished, hidden until then -->
  <div class="scrim" id="ended" hidden>
    <div class="ended" role="dialog" aria-label="Battle ended">
      <p>The battle has ended.</p>
      <p><button type="button" id="return">Return to setup screen?</button></p>
    </div>
  </div>

  <script src="script3.js"></script>

    </body>
</html>
