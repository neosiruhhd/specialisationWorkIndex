<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>protoHealth2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Health: circle</h1>

    <!-- instead of a flexbox styled to look like a vertical health bar, im using a circular SVG, but with the same back-grey fill and font-red fill as last time. viewbox is a property that allows me to state how many units i want the SVG to span to use as a reference, that gets styled by css later on anyways. 'arc' is the class name to mark what the front-red fill is -->
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="50"></circle>
      <circle class="arc" id="arc" cx="60" cy="60" r="50"></circle>
    </svg>

    <label for="hp">Current HP</label>
    <div class="hp-row">
      <input id="hp" type="number" min="0" max="500" step="1" value="500">
      <span>/ 500</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
